<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily">
<title>Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231D6FA3'/%3E%3Ctext x='90' y='122' font-family='Helvetica,Arial' font-size='96' font-weight='bold' fill='white' text-anchor='middle'%3E%E2%82%B1%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ground:#F3F4F1; --surface:#FFFFFF; --surface-2:#EAECE8; --surface-3:#DFE2DD;
  --ink:#171A1C; --ink-2:#3D4548; --muted:#6B736F;
  --rule:#DADDD7; --rule-2:#C3C8C1;
  --accent:#1D6FA3; --amber:#C2740A; --alarm:#A8341E; --good:#1F6B4F;
  --navh:62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#15181A; --surface:#1E2225; --surface-2:#262C30; --surface-3:#333A3E;
    --ink:#E6E9E6; --ink-2:#C3C9C5; --muted:#939C98;
    --rule:#2C3336; --rule-2:#3C4448;
    --amber:#C9901F; --alarm:#E27E66; --good:#4FAE86;
  }
}
:root[data-theme="dark"]{
  --ground:#15181A; --surface:#1E2225; --surface-2:#262C30; --surface-3:#333A3E;
  --ink:#E6E9E6; --ink-2:#C3C9C5; --muted:#939C98;
  --rule:#2C3336; --rule-2:#3C4448;
  --amber:#C9901F; --alarm:#E27E66; --good:#4FAE86;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:-webkit-fill-available}
body{
  margin:0;padding:0;min-height:100vh;min-height:100dvh;
  background:var(--ground); color:var(--ink);
  font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum","ss01";letter-spacing:-.01em}

#app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 6px) 16px calc(var(--navh) + var(--safe-b) + 96px)}
.vhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 0 14px}
.vhead h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.vhead .sub{font-size:12.5px;color:var(--muted);text-align:right}
.view{display:none} .view.on{display:block}

/* ---- nav pinned to the very bottom ---- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--rule);
  padding-bottom:var(--safe-b);
  display:grid;grid-template-columns:repeat(5,1fr);
}
nav button{
  background:none;border:none;padding:8px 2px 7px;font:inherit;font-size:10px;font-weight:600;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;letter-spacing:.01em;
}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--accent)}

/* ---- FAB ---- */
.fab{
  position:fixed;right:16px;bottom:calc(var(--navh) + var(--safe-b) + 14px);z-index:41;
  width:58px;height:58px;border-radius:29px;border:none;cursor:pointer;
  background:var(--accent);color:#fff;font-size:30px;font-weight:300;line-height:1;
  box-shadow:0 4px 16px rgba(0,0,0,.22);display:none;align-items:center;justify-content:center;padding:0 0 3px;
}
.fab.on{display:flex}
.fab:active{transform:scale(.94)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:15px;margin-bottom:11px}
.card h2{margin:0 0 12px;font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}

.hero{text-align:center;padding:24px 16px 20px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;margin-bottom:11px}
.hero .lbl{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero .big{font-size:clamp(42px,14.5vw,58px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:7px 0 4px}
.hero .big.over{color:var(--alarm)}
.hero .note{font-size:13px;color:var(--muted)}
.bar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin:15px 0 8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.bar i.hot{background:var(--alarm)} .bar i.gd{background:var(--good)}
.split{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:none}
.row .g{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:500}
.row .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.row .v{font-weight:600;white-space:nowrap}
.row .v.neg{color:var(--alarm)} .row .v.pos{color:var(--good)}
button.row{width:100%;background:none;border:none;border-bottom:1px solid var(--rule);font:inherit;color:inherit;text-align:left;cursor:pointer}
button.row:active{background:var(--surface-2)}
.chev{color:var(--muted);font-size:17px;flex:none}
.acctgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.acct{background:var(--surface-2);border:1px solid var(--rule);border-radius:11px;padding:11px 12px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.acct:active{background:var(--surface-3)}
.acct .an{font-size:12px;color:var(--muted);font-weight:600}
.acct .av{font-size:17px;font-weight:700;letter-spacing:-.02em}
.acct .av.neg{color:var(--alarm)}
.sub-acct{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:5px 0 0 0}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--surface-2);border:1px solid var(--rule);border-radius:10px;padding:8px 11px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;display:flex;align-items:baseline;gap:6px}
.chip:active{background:var(--surface-3)}
.chip b{font-weight:600} .chip span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:13px 18px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--rule-2)}
.btn.dan{background:var(--alarm);color:#fff}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:9px}
.btn:active{opacity:.85}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{background:var(--surface-2);border:1px solid var(--rule-2);color:var(--muted);border-radius:9px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.rowopen{text-align:left;background:none;border:none;font:inherit;color:inherit;padding:0;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

label.f{display:block;margin-bottom:12px}
label.f .k{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--ground);color:var(--ink);border:1px solid var(--rule-2);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;min-height:44px}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:400px){ .two{grid-template-columns:1fr} }
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px}
.chk:last-child{border-bottom:none}
.chk input{width:20px;height:20px;min-height:0;flex:none;accent-color:var(--accent)}

.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.calhead div{text-align:center;font-size:10px;font-weight:700;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{aspect-ratio:1/1;border-radius:9px;background:var(--surface-2);border:1px solid var(--rule);padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums}
.day .d{font-size:10px;color:var(--muted);line-height:1}
.day .a{font-size:11px;font-weight:700;line-height:1.1}
.day.blank{background:none;border:none}
.day.under{background:color-mix(in srgb,var(--good) 15%,var(--surface));border-color:color-mix(in srgb,var(--good) 34%,var(--rule))}
.day.over{background:color-mix(in srgb,var(--alarm) 15%,var(--surface));border-color:color-mix(in srgb,var(--alarm) 36%,var(--rule))}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.day.out{opacity:.34}
button.day{font:inherit;cursor:pointer}

.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:20px;vertical-align:1px}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.no{background:color-mix(in srgb,var(--alarm) 18%,transparent);color:var(--alarm)}
.pill.cr{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:22px 12px;line-height:1.5}
.hint{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.45}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;touch-action:none;overscroll-behavior:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(12px + var(--safe-b));max-height:85dvh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(101%);transition:transform .22s ease-out;max-width:560px;margin:0 auto}
.sbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:2px}
.sheet.on{transform:translateY(0)}
body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.sheet h3{margin:0 0 14px;font-size:17px;font-weight:700}
.grabzone{padding:2px 0 11px;margin:-6px 0 0;cursor:grab;touch-action:none}
.sheet .foot{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.sheet .foot .btn{width:100%}
.sheet .foot #shSave{order:2}
.sheet .foot #shX{order:1}
.row.skip .t,.row.skip .v{opacity:.42;text-decoration:line-through}
.grab{width:42px;height:5px;border-radius:3px;background:var(--rule-2);margin:0 auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + var(--safe-b) + 82px);z-index:60;background:var(--ink);color:var(--ground);border-radius:11px;padding:11px 14px;font-size:13.5px;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:.97;pointer-events:auto}
.toast button{background:none;border:none;color:#7cc0e8;font:inherit;font-weight:700;cursor:pointer;padding:0;flex:none}
.sw{width:34px;height:34px;border-radius:17px;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
</style>
</head>
<body>

<div id="app">
  <div class="view on" id="v-today"></div>
  <div class="view" id="v-money"></div>
  <div class="view" id="v-cal"></div>
  <div class="view" id="v-loans"></div>
  <div class="view" id="v-setup"></div>
  <div class="view" id="v-plan"></div>
</div>

<button class="fab on" id="fab" aria-label="Add spending">+</button>

<nav>
  <button data-v="today" aria-current="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-v="money"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 11h20"/><circle cx="17" cy="15" r="1.3"/></svg>Envelopes</button>
  <button data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-v="loans"><svg viewBox="0 0 24 24"><path d="M3 17V9M8.5 17V6M14 17v-7M19.5 17V4"/><path d="M3 21h18"/></svg>Loans</button>
  <button data-v="setup"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></svg>Setup</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===== Daily v1.1 — everything stays in this browser. No personal data in this file. ===== */
var VER="1.30", KEY="daily.v1";
var $=function(s,r){ return (r||document).querySelector(s); };
var el=function(t){ return document.createElement(t); };
var ACCENTS=["#1D6FA3","#1F6B4F","#8A3E9E","#C2740A","#A8341E","#2B6DB0","#0E7C86","#B03A6B"];

function seedDB(){
  return {
    v:2, ver:VER,
    settings:{ cur:"₱", rule:"semimonthly", farePerDay:150, officeDow:[], theme:"auto", accent:"#1D6FA3" },
    cycle: defaultCycle(todayISO()),
    accounts:[
      {id:"cash",  name:"Cash",         type:"cash",   bal:0},
      {id:"bank1", name:"Bank 1",       type:"cash",   bal:0},
      {id:"bank2", name:"Bank 2",       type:"cash",   bal:0},
      {id:"bills", name:"Bills account",type:"cash",   bal:0},
      {id:"cred1", name:"Credit line",  type:"credit", bal:0, stmtDay:25, dueDay:15}
    ],
    envelopes:[
      {id:"fare", name:"Fare", accts:["cash"]},
      {id:"food", name:"Food", accts:["bank1"]},
      {id:"fun",  name:"Fun",  accts:["bank2"]}
    ],
    cats:[
      {id:"jeep",     name:"Jeep / bus",def:150,env:"fare"},
      {id:"taxi",     name:"Motortaxi", def:135,env:"fare"},
      {id:"breakfast",name:"Breakfast", def:80, env:"food"},
      {id:"lunch",    name:"Lunch",     def:200,env:"food"},
      {id:"dinner",   name:"Dinner",    def:240,env:"food"},
      {id:"drink",    name:"Drink",     def:40, env:"food"},
      {id:"snack",    name:"Snack",     def:100,env:"food"},
      {id:"eatout",   name:"Eating out",def:425,env:"fun"},
      {id:"night",    name:"Night out", def:400,env:"fun"},
      {id:"other",    name:"Other",     def:0,  env:"fun"}
    ],
    goals:[], fixed:[], loans:[], txns:[], office:[], hist:{}, reserved:0
  };
}

/* ---- dates ---- */
function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function parse(s){ var p=String(s).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function addD(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function between(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW=["S","M","T","W","T","F","S"];
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function fmtD(s){ var d=parse(s); return d.getDate()+" "+MON[d.getMonth()]; }
function lastDay(y,m){ return new Date(y,m+1,0).getDate(); }
function defaultCycle(t){
  var d=parse(t),y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
  if(day<15) return {start:iso(new Date(y,m-1,lastDay(y,m-1))),end:iso(new Date(y,m,14)),income:0,adjust:0};
  if(day<lastDay(y,m)) return {start:iso(new Date(y,m,15)),end:iso(new Date(y,m,lastDay(y,m)-1)),income:0,adjust:0};
  return {start:iso(new Date(y,m,lastDay(y,m))),end:iso(new Date(y,m+1,14)),income:0,adjust:0};
}
/* the 15th and the last day of the month are the anchors; a cycle runs
   from one anchor to the day before the next, whatever the stored end says */
function semiAnchorAfter(s){
  var d=parse(s), y=d.getFullYear(), m=d.getMonth(), dd=d.getDate();
  if(dd<15) return iso(new Date(y,m,15));
  if(dd<lastDay(y,m)) return iso(new Date(y,m,lastDay(y,m)));
  return iso(new Date(y,m+1,15));
}
function semiCycleFor(s){
  var d=parse(s), y=d.getFullYear(), m=d.getMonth(), dd=d.getDate();
  var st = (dd<15) ? iso(new Date(y,m-1,lastDay(y,m-1)))
         : (dd<lastDay(y,m) ? iso(new Date(y,m,15)) : iso(new Date(y,m,lastDay(y,m))));
  return {start:st, end:addD(semiAnchorAfter(st),-1)};
}
function cycleLooksOff(){
  if(DB.settings.rule!=="semimonthly") return null;
  var c=semiCycleFor(DB.cycle.start);
  return (c.start===DB.cycle.start && c.end===DB.cycle.end) ? null : c;
}
function nextCycle(c,rule){
  if(rule==="fortnightly"){ var s=addD(c.end,1); return {start:s,end:addD(s,13),income:c.income,adjust:0}; }
  if(rule==="monthly"){ var s2=addD(c.end,1), d2=parse(s2);
    return {start:s2,end:iso(new Date(d2.getFullYear(),d2.getMonth()+1,d2.getDate()-1)),income:c.income,adjust:0}; }
  if(rule==="custom"){ var s3=addD(c.end,1);
    return {start:s3,end:addD(s3,Math.max(0,between(c.start,c.end))),income:c.income,adjust:0}; }
  var st=semiAnchorAfter(c.start);
  return {start:st, end:addD(semiAnchorAfter(st),-1), income:c.income, adjust:0};
}

/* ---- store ---- */
var DB;
function load(){
  try{ var r=localStorage.getItem(KEY); if(r){ DB=JSON.parse(r); migrate(); return; } }catch(e){}
  DB=seedDB(); save();
}
function migrate(){
  var d=seedDB(),k;
  for(k in d) if(!(k in DB)) DB[k]=d[k];
  for(k in d.settings) if(!(k in DB.settings)) DB.settings[k]=d.settings[k];
  if(DB.cycle && DB.cycle.adjust==null) DB.cycle.adjust=0;
  // an empty list is as broken as a missing one: put the defaults back
  ["cats","accounts","envelopes"].forEach(function(key){
    if(!Array.isArray(DB[key]) || !DB[key].length) DB[key]=d[key];
  });
  ["loans","fixed","goals","txns","office"].forEach(function(key){
    if(!Array.isArray(DB[key])) DB[key]=[];
  });
  if(!DB.hist || typeof DB.hist!=="object") DB.hist={};
  if(DB.reserved==null) DB.reserved=0;
  // v1 -> v2 : envelope.acct (single) becomes envelope.accts (array)
  (DB.envelopes||[]).forEach(function(e){
    if(!e.accts) e.accts = e.acct ? [e.acct] : [];
    delete e.acct;
  });
  DB.ver=VER; DB.v=2;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ toast("Could not save. Storage may be blocked."); } }
function uid(){ return Math.random().toString(36).slice(2,9); }
function P(n){ var g=n<0; n=Math.abs(Math.round(n)); return (g?"-":"")+DB.settings.cur+n.toLocaleString("en-US"); }
function P2(n){
  var g=n<0; n=Math.abs(n);
  return (g?"-":"")+DB.settings.cur+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---- lookups ---- */
function acct(id){ for(var i=0;i<DB.accounts.length;i++) if(DB.accounts[i].id===id) return DB.accounts[i]; return null; }
function cat(id){ for(var i=0;i<DB.cats.length;i++) if(DB.cats[i].id===id) return DB.cats[i]; return null; }
function env(id){ for(var i=0;i<DB.envelopes.length;i++) if(DB.envelopes[i].id===id) return DB.envelopes[i]; return null; }
function envTotal(E){ var s=0; (E.accts||[]).forEach(function(id){ var A=acct(id); if(A) s+=(+A.bal||0); }); return s; }

/* ---- engine ---- */
function onHand(){ var s=0; DB.accounts.forEach(function(a){ if(a.type==="cash") s+=(+a.bal||0); }); return s; }
function inCycle(d){ return d>=DB.cycle.start && d<=DB.cycle.end; }
function dayInCycle(day){ return dayInWindow(day,DB.cycle.start,DB.cycle.end); }
function dayInWindow(day,a,b){
  if(!day) return null;
  var d=parse(a), e=parse(b), guard=0;
  while(d<=e && guard++<400){
    var eff=Math.min(+day, lastDay(d.getFullYear(),d.getMonth()));
    if(d.getDate()===eff) return iso(d);
    d.setDate(d.getDate()+1);
  }
  return null;
}
function goalById(id){ for(var i=0;i<DB.goals.length;i++) if(DB.goals[i].id===id) return DB.goals[i]; return null; }
function onOrAfter(from,day){
  if(!day) return null;
  var d=parse(from), guard=0;
  while(guard++<70){
    var eff=Math.min(+day,lastDay(d.getFullYear(),d.getMonth()));
    if(d.getDate()<=eff){ d.setDate(eff); return iso(d); }
    d.setDate(1); d.setMonth(d.getMonth()+1);
  }
  return null;
}
/* a purchase lands on the statement that closes next, and that statement
   is paid on the first due day after it closes */
function creditDueFor(A,when){
  var S=+A.stmtDay||0, D=+A.dueDay||0;
  if(!D) return null;
  if(!S) return onOrAfter(when,D);
  var close=onOrAfter(when,S);
  if(!close) return null;
  return onOrAfter(addD(close,1),D);
}
/* what this card owes, split by the date each bill is actually due */
function creditBuckets(A){
  var by={}, spend=0, paid=0;
  DB.txns.forEach(function(T){
    if(T.kind==="pay" && T.to===A.id){ paid+=(+T.amt||0); return; }
    if(T.acct!==A.id) return;
    if(T.kind==="inc"){ paid+=(+T.amt||0); return; }   // money into a card pays it down
    if(T.kind==="pay") return;
    var amt=(+T.amt||0)+(T.kind==="xfer"?(+T.fee||0):0);
    var due=creditDueFor(A,T.date); if(!due) return;
    by[due]=(by[due]||0)+amt; spend+=amt;
  });
  var older=Math.round((+A.bal||0)+paid-spend);
  if(older>0){
    var d0=onOrAfter(todayISO(),+A.dueDay||0);
    if(d0) by[d0]=(by[d0]||0)+older;
  }
  // payments clear the oldest bill first
  var ks=Object.keys(by).sort();
  for(var i=0;i<ks.length && paid>0.005;i++){
    var take=Math.min(paid,by[ks[i]]);
    by[ks[i]]-=take; paid-=take;
    if(Math.round(by[ks[i]])<=0) delete by[ks[i]];
  }
  return by;
}
function commitmentsIn(a,b,noCredit){
  var out=[];
  DB.loans.forEach(function(L){ if(!L.paid && L.due>=a && L.due<=b) out.push({id:L.id,kind:"loan",who:(L.lender||L.loan||"Loan"),name:(L.lender?L.lender+" ":"")+L.loan,amt:+L.amt,date:L.due}); });
  DB.fixed.forEach(function(F){ var d=dayInWindow(F.day,a,b); if(d && (F.done||[]).indexOf(d)===-1) out.push({id:F.id,kind:"fixed",who:F.name,name:F.name,amt:+F.amt,date:d}); });
  if(!noCredit) DB.accounts.forEach(function(A){
    if(A.type!=="credit") return;
    var by=creditBuckets(A);
    Object.keys(by).forEach(function(due){
      if(due<a || due>b) return;
      if(Math.round(by[due])<=0) return;
      out.push({id:A.id+"@"+due,kind:"credit",who:A.name,name:A.name+" bill",amt:by[due],date:due});
    });
  });
  out.sort(function(x,y){ return x.date<y.date?-1:1; });
  return out;
}
function cycleAt(n){
  var c={start:DB.cycle.start,end:DB.cycle.end};
  for(var i=0;i<n;i++) c=nextCycle(c,DB.settings.rule);
  return {start:c.start,end:c.end};
}
function typicalDaily(){
  // a trimmed average: the biggest 10% of days are loan payments and one-offs,
  // and those are already counted separately, so they must not inflate living cost
  var t=todayISO(), d=addD(t,-60), v=[], guard=0;
  while(d<t && guard++<70){
    if(DB.hist[d]!=null || txnsOn(d).n>0) v.push(spentOn(d));
    d=addD(d,1);
  }
  if(!v.length) return 0;
  v.sort(function(a,b){ return a-b; });
  var keep=Math.max(1, v.length-Math.round(v.length*0.10));
  var s=0; for(var i=0;i<keep;i++) s+=v[i];
  return s/keep;
}
function commitments(){ return commitmentsIn(DB.cycle.start,DB.cycle.end); }
function committedTotal(){ var s=0; commitments().forEach(function(c){ s+=c.amt; }); return s; }
function officeDaysLeft(){ var t=todayISO(),n=0; DB.office.forEach(function(d){ if(d>=t&&inCycle(d)) n++; }); return n; }
function fareReserve(){ return officeDaysLeft()*(+DB.settings.farePerDay||0); }
function goalDay(G){
  if(G.day!=null) return +G.day||0;
  if(G.when==="eom") return 31;
  if(G.when==="mid") return 15;
  return 0;
}
function goalDue(G){ var d=goalDay(G); return d ? !!dayInCycle(d) : true; }
function ord(n){ n=+n; var r=n%100; if(r>=11&&r<=13) return n+"th";
  return n + ({1:"st",2:"nd",3:"rd"}[n%10] || "th"); }
function whenLabel(G){
  var d=goalDay(G);
  if(!d) return "every payday";
  if(d>=31) return "last day of the month";
  return "the "+ord(d)+" of each month";
}
function goalsUnfunded(){ var s=0; DB.goals.forEach(function(g){ if(goalDue(g) && g.fundedCycle!==DB.cycle.start) s+=(+g.perCycle||0); }); return s; }
function isCredit(id){ var A=acct(id); return !!(A&&A.type==="credit"); }
function txnsOn(d){
  var s=0,n=0;
  DB.txns.forEach(function(T){
    if(T.date!==d) return;
    if(T.kind==="pay"){ n++; return; }          // money out, but not spending
    if(T.kind==="xfer"){
      var f=+T.fee||0;
      if(f>0 && !isCredit(T.acct)){ n++; s+=f; }
      return;
    }
    n++;
    if(!isCredit(T.acct) && T.kind!=="inc") s+=+T.amt;
  });
  return {sum:s,n:n};
}
function spentOn(d){
  var t=txnsOn(d);
  if(t.n) return t.sum;                       // logged in the app wins
  var hv=DB.hist[d];                          // otherwise fall back to imported history
  return hv!=null ? +hv : 0;
}
function spentRange(a,b){
  var s=0,d=a,guard=0;
  while(d<=b && guard++<400){ s+=spentOn(d); d=addD(d,1); }
  return s;
}
function isOfficeDay(d){ return DB.office.indexOf(d)>-1; }
function fareFor(d){ return isOfficeDay(d) ? (+DB.settings.farePerDay||0) : 0; }
function officeDaysIn(a,b){ var n=0; DB.office.forEach(function(d){ if(d>=a&&d<=b) n++; }); return n; }
function officeDow(){ return DB.settings.officeDow||[]; }
function officeDaysPlanned(a,b){
  var dow=officeDow(), n=0, d=parse(a), e=parse(b), guard=0;
  while(d<=e && guard++<400){
    var s=iso(d);
    if(DB.office.indexOf(s)>-1) n++;
    else if(dow.indexOf(d.getDay())>-1) n++;
    d.setDate(d.getDate()+1);
  }
  return n;
}
function daysLeft(){ var t=todayISO(); if(t>DB.cycle.end) return 1; if(t<DB.cycle.start) return between(DB.cycle.start,DB.cycle.end)+1; return between(t,DB.cycle.end)+1; }
function notSetUp(){
  var anyBal=false;
  DB.accounts.forEach(function(a){ if(a.type==="cash" && (+a.bal||0)!==0) anyBal=true; });
  return !anyBal && DB.txns.length===0;
}
function reserved(){ return +DB.reserved||0; }
function spendable(){ return onHand()-reserved(); }
function freeToSpend(){ return onHand() - reserved() - committedTotal() - fareReserve() - goalsUnfunded() + (+DB.cycle.adjust||0); }
function elapsedDays(){
  var t=todayISO(), a=DB.cycle.start, b=(t<DB.cycle.end?t:DB.cycle.end);
  return (b<a) ? 0 : between(a,b)+1;
}
function avgSoFar(){
  var n=elapsedDays(); if(n<=0) return 0;
  return spentRange(DB.cycle.start,(todayISO()<DB.cycle.end?todayISO():DB.cycle.end))/n;
}
function shortfall(){ var f=freeToSpend(); return f<0 ? -f : 0; }
function perDayBase(){ var f=freeToSpend(); if(f<0) return 0; var d=daysLeft(); return d>0?f/d:f; }
function todayAllowance(){ return perDayBase() + fareFor(todayISO()) - spentOn(todayISO()); }

/* ================= views ================= */
var VIEW="today";
var lastView=null;
function render(){
  var keepY = (VIEW===lastView) ? (window.scrollY||window.pageYOffset||0) : 0;
  ["today","money","cal","loans","setup","plan"].forEach(function(v){ $("#v-"+v).classList.toggle("on",v===VIEW); });
  var navFor = (VIEW==="plan") ? "setup" : VIEW;
  document.querySelectorAll("nav button").forEach(function(b){ b.setAttribute("aria-current", b.dataset.v===navFor?"true":"false"); });
  $("#fab").classList.toggle("on", VIEW==="today"||VIEW==="money");
  ({today:renderToday,money:renderMoney,cal:renderCal,loans:renderLoans,setup:renderSetup,plan:renderPlanView})[VIEW]();
  lastView=VIEW;
  window.scrollTo(0,keepY);
}

/* ---------- TODAY ---------- */
var recFilter="today";
function renderToday(){
  var v=$("#v-today"), t=todayISO(), td=parse(t);
  var fare=fareFor(t), base=perDayBase(), cap=base+fare;
  var allow=todayAllowance(), spent=spentOn(t);
  var pct = cap>0 ? Math.max(0,Math.min(100,spent/cap*100)) : (spent>0?100:0);
  var h="";

  h+='<div class="vhead"><div><h1>'+DAYS[td.getDay()]+'</h1>'
    +'<div style="font-size:13px;color:var(--muted);margin-top:2px">'+fmtD(t)+' '+td.getFullYear()+'</div></div>'
    +'<span class="sub">'+fmtD(DB.cycle.start)+" – "+fmtD(DB.cycle.end)
    +(DB.cycle.income?'<br>Pay '+P(DB.cycle.income):"")+'</span></div>';

  if(t>DB.cycle.end){
    h+='<div class="card" style="border-color:var(--amber)"><h2 style="color:var(--amber)">Cycle finished</h2>'
      +'<div class="t" style="font-size:15px;margin-bottom:4px">Ended '+fmtD(DB.cycle.end)+'.</div>'
      +'<div class="s" style="color:var(--muted);font-size:13px">Start the next one. Balances, loans and history all stay.</div>'
      +'<div class="btnrow"><button class="btn" id="rollNow">Start the next cycle</button></div></div>';
  }

  if(notSetUp()){
    h+='<div class="hero"><div class="lbl">Nothing entered yet</div>'
      +'<div class="big" style="font-size:38px">Set up first</div>'
      +'<div class="note">The daily number comes from the money in your accounts. They are all at zero.</div>'
      +'<div class="btnrow" style="margin-top:16px"><button class="btn" id="goMoney">Enter my balances</button></div>'
      +'<div class="btnrow"><button class="btn sec" id="goSetup">Import my seed file</button></div></div>';
    v.innerHTML=h;
    var gm=$("#goMoney"), gs=$("#goSetup");
    if(gm) gm.addEventListener("click",function(){ VIEW="money"; render(); });
    if(gs) gs.addEventListener("click",function(){ VIEW="setup"; render(); });
    return;
  }

  h+='<div class="hero"><div class="lbl">You can spend</div>'
    +'<div class="big num'+(allow<0?" over":"")+'">'+P(allow)+'</div>'
    +'<div class="note">'+(shortfall()?("Short by "+P(shortfall())+" this cycle")
        :(allow<0?("Over by "+P(-allow)+" today"):(daysLeft()+" day"+(daysLeft()===1?"":"s")+" left")))+'</div>'
    +'<div class="bar"><i class="'+(spent>cap?"hot":"")+'" style="width:'+pct+'%"></i></div>'
    +'<div class="split"><span class="num">'+P(spent)+' spent</span><span class="num">'+(shortfall()?"nothing free":(P(base)+(fare?" + "+P(fare)+" fare":" · no fare")))+'</span></div></div>';

  if(shortfall()){
    h+='<div class="card" style="border-color:var(--alarm)"><h2 style="color:var(--alarm)">Ways to close the '+P(shortfall())+'</h2>'
      +'<div class="row"><div class="g"><div class="t">Log money that has landed</div><div class="s">Pay, a refund, a transfer in</div></div></div>'
      +(reserved()>0?'<button class="row" data-go2="reserved"><div class="g"><div class="t">Release set-aside</div><div class="s">'+P(reserved())+' held back</div></div><span class="chev">›</span></button>':'')
      +(fareReserve()>0?'<button class="row" data-go2="setup"><div class="g"><div class="t">Untick office days</div><div class="s">'+P(fareReserve())+' reserved for fare</div></div><span class="chev">›</span></button>':'')
      +(committedTotal()>0?'<button class="row" data-go2="loans"><div class="g"><div class="t">Tick off what you paid</div><div class="s">'+P(committedTotal())+' still unpaid</div></div><span class="chev">›</span></button>':'')
      +(goalsUnfunded()>0?'<button class="row" data-go2="setup"><div class="g"><div class="t">Pause a savings goal</div><div class="s">'+P(goalsUnfunded())+' held back</div></div><span class="chev">›</span></button>':'')
      +'</div>';
  }

  h+='<div class="card"><h2>Can I afford this?</h2>'
    +'<input id="affordAmt" type="number" inputmode="decimal" placeholder="Amount">'
    +'<button class="btn sec" id="affordGo" style="margin-top:8px">Check</button>'
    +'<div id="affordOut" class="hint"></div></div>';

  h+='<div class="card"><h2>Suggestions</h2><div class="chips" id="quick">';
  DB.cats.forEach(function(c){ if(c.def) h+='<button class="chip" data-cat="'+c.id+'"><b>'+esc(c.name)+'</b><span class="num">'+P(c.def)+'</span></button>'; });
  h+='</div><div class="hint">Tap to log at the usual amount. + for anything else.</div></div>';

  h+='<div class="card"><h2>Recent transactions</h2><div class="seg" id="recSeg">'
    +sg("today","Today",recFilter)+sg("week","7 days",recFilter)+sg("month","This month",recFilter)+sg("all","All",recFilter)+'</div>';
  var list=filterTxns(recFilter);
  if(!list.length) h+='<div class="empty">Nothing logged'+(recFilter==="today"?" today":"")+'.</div>';
  else{
    var tot=0; list.forEach(function(T){ if(T.kind==="xfer"||T.kind==="pay"||isCredit(T.acct)) return; tot += (T.kind==="inc"? -(+T.amt) : +T.amt); });
    list.slice(0,40).forEach(function(T){
      var C=cat(T.cat), A=acct(T.acct);
      var dest=null;
      if(T.kind==="xfer"||T.kind==="pay"){
        dest = (String(T.to).indexOf("g:")===0) ? goalById(String(T.to).slice(2)) : acct(T.to);
      }
      var usedNote=false, title;
      if(T.kind==="xfer") title="Transfer";
      else if(T.kind==="pay"){ title=T.note||"Payment"; usedNote=!!T.note; }
      else if(C) title=C.name;
      else { title=T.note||(T.kind==="inc"?"Money in":"Other"); usedNote=!!T.note; }
      var sub = fmtD(T.date)+' · '+esc(A?A.name:"?")
              + (dest?" → "+esc(dest.name):(A&&A.type==="credit"?" (credit)":""))
              + ((T.note && !usedNote)?" · "+esc(T.note):"");
      h+='<button class="row" data-edit="'+T.id+'"><div class="g"><div class="t">'+esc(title)
        +(T.kind==="pay"?' <span class="pill cr">payment</span>':'')+'</div>'
        +'<div class="s">'+sub+'</div></div>'
        +'<div class="v num'+(T.kind==="inc"?" pos":"")+'" style="'+((T.kind==="xfer"||T.kind==="pay")?"color:var(--muted)":"")+'">'+(T.kind==="inc"?"+":"")+P(T.amt)+'</div><span class="chev">›</span></button>';
    });
    if(list.length>40) h+='<div class="hint">Showing 40 of '+list.length+'.</div>';
    h+='<div class="row" style="border-top:2px solid var(--ink);border-bottom:none;padding-top:10px"><div class="g"><div class="t" style="font-weight:700">Net spent</div></div><div class="v num">'+P(tot)+'</div></div>';
  }
  h+='</div>';

  v.innerHTML=h;
  var rn=$("#rollNow"); if(rn) rn.addEventListener("click",rollCycle);
  v.querySelectorAll("[data-go2]").forEach(function(b){ b.addEventListener("click",function(){
    var g=b.dataset.go2;
    if(g==="reserved"){ VIEW="setup"; render(); openReserved(); }
    else { VIEW=g; render(); }
  }); });
  $("#quick").addEventListener("click",function(e){ var b=e.target.closest("button"); if(b) quickLog(cat(b.dataset.cat)); });
  $("#affordGo").addEventListener("click",afford);
  $("#affordAmt").addEventListener("keydown",function(e){ if(e.key==="Enter") afford(); });
  $("#recSeg").addEventListener("click",function(e){ var b=e.target.closest("button"); if(b){ recFilter=b.dataset.k; renderToday(); } });
  v.querySelectorAll("[data-edit]").forEach(function(b){ b.addEventListener("click",function(){ openTxn(b.dataset.edit); }); });
}
function sg(k,label,cur){ return '<button data-k="'+k+'" aria-pressed="'+(cur===k)+'">'+label+'</button>'; }
function filterTxns(f){
  var t=todayISO(), from="0000-00-00";
  if(f==="today") from=t;
  else if(f==="week") from=addD(t,-6);
  else if(f==="month") from=t.slice(0,8)+"01";
  return DB.txns.filter(function(T){ return T.date>=from && T.date<=t; })
    .sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
}
function afford(){
  var a=+$("#affordAmt").value,out=$("#affordOut");
  if(!a){ out.textContent=""; return; }
  var now=todayAllowance()-a, after=(freeToSpend()-a)/Math.max(1,daysLeft()-1);
  out.innerHTML = now>=0
    ? '<span class="pill ok">Yes</span> Leaves '+P(now)+' today, about '+P(after)+' a day after this.'
    : '<span class="pill no">Not today</span> You’d be '+P(-now)+' over, and the rest drops to about '+P(after)+' a day.';
}

var planOff=1;
function planGet(s){
  if(!DB.plan) DB.plan={};
  var v=DB.plan[s];
  if(typeof v==="number") v={pay:v};
  if(!v || typeof v!=="object") v={};
  if(DB.planOff && DB.planOff[s]!=null && v.off==null) v.off=+DB.planOff[s];
  return v;
}
function planPut(s,O){
  if(!DB.plan) DB.plan={};
  var empty = O.pay==null && O.sav==null && O.off==null && O.livDay==null
              && !(O.skip||[]).length && !(O.add||[]).length;
  if(empty){ delete DB.plan[s]; } else { DB.plan[s]=O; }
  if(DB.planOff) delete DB.planOff[s];
  save();
}
function planKey(x){ return x.id+"@"+x.date; }
function planFor(n){
  var c=cycleAt(n), O=planGet(c.start);
  var days=between(c.start,c.end)+1;
  var items=commitmentsIn(c.start,c.end,true), skip=O.skip||[], due=0;
  items.forEach(function(x){ x.skip=skip.indexOf(planKey(x))>-1; if(!x.skip) due+=x.amt; });
  (O.add||[]).forEach(function(x){
    items.push({id:x.id,kind:"extra",name:x.name,amt:+x.amt,date:x.date||c.start,skip:false,mine:true});
    due+=+x.amt;
  });
  items.sort(function(x,y){ return x.date<y.date?-1:1; });

  var autoSav=0;
  DB.goals.forEach(function(g){ var d=goalDay(g); if(!d || dayInWindow(d,c.start,c.end)) autoSav+=(+g.perCycle||0); });
  var sav=(O.sav!=null)?+O.sav:autoSav;

  var autoOff=officeDaysPlanned(c.start,c.end);
  var off=(O.off!=null)?+O.off:autoOff;
  var fare=off*(+DB.settings.farePerDay||0);

  var autoLiv=typicalDaily();
  var livDay=(O.livDay!=null)?+O.livDay:autoLiv;

  var pay=(O.pay!=null)?+O.pay:(+DB.cycle.income||0);

  return {start:c.start,end:c.end,days:days,items:items,due:due,
    sav:sav,autoSav:autoSav,savSet:O.sav!=null,
    off:off,autoOff:autoOff,offSet:O.off!=null,fare:fare,
    liv:livDay*days,livDay:livDay,autoLiv:autoLiv,livSet:O.livDay!=null,
    pay:pay,paySet:O.pay!=null,
    edited:!!(O.pay!=null||O.sav!=null||O.off!=null||O.livDay!=null||(O.skip||[]).length||(O.add||[]).length),
    left:pay-due-sav-fare-livDay*days};
}

function openLoanPlan(){
  var body=fld("Lender","plLen","text","")+fld("Loan name","plNam","text","")
    +'<div class="two">'+fld("Number of payments","plN","number",6)+fld("Amount each","plAmt","number","")+'</div>'
    +fld("Last payment (leave blank if the same)","plLast","number","")
    +fld("First payment due","plDue","date",todayISO())
    +sel("How often","plFreq",[["monthly","Monthly, same day"],["semi","Twice a month, 15th and end of month"]],"monthly")
    +'<div class="hint">This creates the whole schedule in one go. Useful when the final payment is a different amount, which is usually the case.</div>';
  openSheet("Add a loan",body,function(){
    var n=+$("#plN").value||0, amt=+$("#plAmt").value||0, last=+$("#plLast").value||0;
    if(!n||!amt){ toast("Need a count and an amount"); return false; }
    var lender=$("#plLen").value, name=$("#plNam").value||"Loan";
    var freq=$("#plFreq").value, d=parse($("#plDue").value);
    for(var i=0;i<n;i++){
      var a = (i===n-1 && last) ? last : amt;
      DB.loans.push({id:uid(),lender:lender,loan:name,amt:a,due:iso(d),paid:false});
      if(freq==="monthly"){
        var day=d.getDate(), y=d.getFullYear(), m=d.getMonth()+1;
        d=new Date(y,m,Math.min(day,lastDay(y,m)));
      } else {
        if(d.getDate()>=15) d=new Date(d.getFullYear(),d.getMonth(),lastDay(d.getFullYear(),d.getMonth()));
        else d=new Date(d.getFullYear(),d.getMonth(),15);
        if(d.getDate()!==15 && d.getDate()!==lastDay(d.getFullYear(),d.getMonth())) d.setDate(15);
        if(iso(d)<=DB.loans[DB.loans.length-1].due){
          var y2=d.getFullYear(), m2=d.getMonth();
          d = d.getDate()>=15 ? new Date(y2,m2+1,15) : new Date(y2,m2,lastDay(y2,m2));
        }
      }
    }
    toast(n+" payments added");
    return true;
  });
}
function loanById(id){ for(var i=0;i<DB.loans.length;i++) if(DB.loans[i].id===id) return DB.loans[i]; return null; }

function openPayOff(o){
  var accts=DB.accounts.map(function(a){ return [a.id,a.name+(a.type==="credit"?" (credit)":"")]; });
  var pref=DB.settings.lastPayAcct||DB.accounts[0].id;
  openSheet("Pay "+o.name,
    fld("Amount","poAmt","number",Math.round((+o.amt||0)*100)/100)
    +sel("Paid from","poAcct",accts,pref)
    +fld("Date","poDate","date",todayISO())
    +'<label class="chk" style="margin-top:6px"><input type="checkbox" id="poTick"><span>Just tick it off, I already logged this payment</span></label>'
    +'<div class="hint">This takes the money out of the account you pick. It does not count against your daily number, because a loan or a bill is already held back before the daily number is worked out.</div>',
    function(){
      var just=$("#poTick").checked, a=+$("#poAmt").value||0;
      if(!just){
        if(!a){ toast("Enter an amount"); return false; }
        var t={id:uid(),kind:"pay",amt:a,acct:$("#poAcct").value,to:o.credit||"",
               date:$("#poDate").value||todayISO(),note:o.name,ref:(o.ids||[]).join(",")};
        DB.txns.push(t); applyTxn(t,1);
        DB.settings.lastPayAcct=t.acct;
        (o.ids||[]).forEach(function(id){ var L=loanById(id); if(L) L.txn=t.id; });
        if(o.fixed){ var F=fixedById(o.fixed); if(F){ F.done=(F.done||[]); F.done.push(o.date); F.txn=t.id; } }
      } else if(o.fixed){
        var F2=fixedById(o.fixed); if(F2){ F2.done=(F2.done||[]); F2.done.push(o.date); }
      }
      (o.ids||[]).forEach(function(id){ var L=loanById(id); if(L) L.paid=true; });
      save();
      toast(just?"Ticked off":("Paid "+P2(a)));
      return true;
    });

function unpayLoans(ids){
  var drop={};
  ids.forEach(function(id){
    var L=loanById(id); if(!L) return;
    L.paid=false;
    if(L.txn){ drop[L.txn]=1; L.txn=null; }
  });
  Object.keys(drop).forEach(function(tid){
    // one payment can cover several rows, so undo all of them together
    DB.loans.forEach(function(L){ if(L.txn===tid){ L.paid=false; L.txn=null; } });
    for(var i=0;i<DB.txns.length;i++) if(DB.txns[i].id===tid){ applyTxn(DB.txns[i],-1); DB.txns.splice(i,1); break; }
  });
}

    try{ localStorage.removeItem(KEY); }catch(e){}
    DB=seedDB(); save(); render(); toast("Erased");
  });
}
function biggestCash(){
  var best=null;
  DB.accounts.forEach(function(a){ if(a.type!=="cash") return; if(!best||(+a.bal||0)>(+best.bal||0)) best=a; });
  return best;
}
var rollStart=null, rollEnd=null, rollPay=0, rollAcct="";
function rollCycle(){
  var nc=nextCycle(DB.cycle,DB.settings.rule);
  var t=todayISO(), late = t>nc.start && t<=nc.end;
  var cashA=DB.accounts.filter(function(a){ return a.type==="cash"; }).map(function(a){ return [a.id,a.name]; });
  var body=fld("Pay landed on","rcDate","date",(t<nc.start||t>nc.end)?nc.start:t)
    +fld("This cycle ends","rcEnd","date",nc.end)
    +'<div class="two">'+fld("Amount received","rcPay","number",+DB.cycle.income||0)
    +sel("Into","rcAcct",cashA.length?cashA:[["","no cash account"]],DB.settings.payAcct||(cashA[0]||[""])[0])+'</div>'
    +'<div class="hint" style="margin-top:-2px">This logs the pay as money in, so you do not have to add it yourself. Put 0 if you would rather log it manually.</div>' 
    +'<div class="hint" style="margin-top:0">'
    +(late
      ? 'Payroll was due '+fmtD(nc.start)+' and it is already '+fmtD(t)+'. Start the cycle on the day the money actually landed, so the days before it stay in the cycle that just ended.'
      : 'Check both dates before you save. This is the window your daily number divides money over.')
    +'</div>'
    +'<div class="hint">Balances, loans and history stay. Savings go back to unfunded so you can fund them again.</div>';
  openSheet("Payday",body,function(){
    rollStart = $("#rcDate").value || nc.start;
    rollEnd   = $("#rcEnd").value || nc.end;
    if(rollEnd<rollStart){ toast("The end date is before the start"); return false; }
    rollPay   = +$("#rcPay").value||0;
    rollAcct  = $("#rcAcct").value||"";
    if(rollAcct) DB.settings.payAcct=rollAcct;
    setTimeout(doRollFlow,280);
    return true;
  });
}
function doRollFlow(){
  snapshot("Payday roll");
  var any=false;
  DB.accounts.forEach(function(x){ if(x.type==="cash" && Math.round(+x.bal||0)>0) any=true; });
  if(any) return openSweep();
  doRoll(true);
}
function openSweep(){
  var cash=DB.accounts.filter(function(x){ return x.type==="cash" && Math.round(+x.bal||0)>0; });
  var opts=[["__set","Set aside"],["__budget","Budget it next cycle"]];
  DB.goals.forEach(function(g){ opts.push(["g:"+g.id,"To "+g.name]); });
  var tot=0; cash.forEach(function(x){ tot+=Math.round(+x.bal||0); });

  var body='<div class="hint" style="margin-top:0;margin-bottom:6px">Whatever is sitting in your accounts now is last cycle’s leftover, <b>'+P(tot)+'</b> in total. Decide what happens to each one. <b>Set aside</b> keeps the money where it is but takes it out of the budget, so the new cutoff only divides the pay it actually gives you.</div>';
  cash.forEach(function(x){
    body+='<div style="padding:12px 0;border-bottom:1px solid var(--rule)">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'
      +'<b>'+esc(x.name)+'</b><span class="num" style="color:var(--muted)">'+P(+x.bal||0)+'</span></div>'
      +'<div class="two">'
      +'<label class="f" style="margin:0"><span class="k">Amount</span><input id="sw_a_'+x.id+'" type="number" inputmode="decimal" value="'+Math.round(+x.bal||0)+'"></label>'
      +'<label class="f" style="margin:0"><span class="k">What to do</span><select id="sw_t_'+x.id+'">'
      +opts.map(function(o){ return '<option value="'+o[0]+'"'+(o[0]==="__set"?" selected":"")+'>'+o[1]+'</option>'; }).join("")
      +'</select></label></div></div>';
  });
  body+='<div class="hint"><b>Budget it next cycle</b> adds that account back into the daily number, which is the old behaviour. <b>To a goal</b> moves the money out of the account entirely.</div>';

  openSheet("Leftover · "+P(tot),body,function(){
    var setAside=0, moved=0;
    cash.forEach(function(x){
      var amt=+($("#sw_a_"+x.id)||{}).value||0;
      var what=($("#sw_t_"+x.id)||{}).value||"__budget";
      if(amt<=0) return;
      if(what==="__set"){ setAside+=amt; return; }
      if(what==="__budget") return;
      var gid=what.slice(2);
      var G=DB.goals.filter(function(g){ return g.id===gid; })[0];
      if(G){ x.bal=(+x.bal||0)-amt; G.bal=(+G.bal||0)+amt; moved+=amt; }
    });
    if(setAside>0) DB.reserved=(+DB.reserved||0)+setAside;
    var msg=[];
    if(setAside>0) msg.push(P(setAside)+" set aside");
    if(moved>0) msg.push(P(moved)+" moved to savings");
    doRoll(true);
    if(msg.length) toast(msg.join(", "));
    return true;
  });
}

function doRoll(quiet){
  var c=nextCycle(DB.cycle,DB.settings.rule);
  if(rollEnd) c.end=rollEnd;
  if(rollStart && rollStart<=c.end) c.start=rollStart;
  if(rollPay>0) c.income=rollPay;
  DB.cycle=c; DB.cycle.adjust=0;
  DB.goals.forEach(function(g){ g.fundedCycle=null; });

  var msg="Cycle now "+fmtD(DB.cycle.start)+" to "+fmtD(DB.cycle.end);
  if(rollPay>0 && rollAcct && acct(rollAcct)){
    var sal=DB.cats.filter(function(c){ return /salary|pay|income/i.test(c.name); })[0];
    var t={id:uid(),kind:"inc",amt:rollPay,cat:sal?sal.id:"",acct:rollAcct,
           date:DB.cycle.start,note:"Salary"};
    DB.txns.push(t); applyTxn(t,1);
    msg += ". "+P(rollPay)+" in to "+acct(rollAcct).name;
  }
  rollStart=null; rollEnd=null; rollPay=0; rollAcct="";
  save(); render();
  toast(msg);
}

    function(){ DB.reserved=Math.max(0,+$("#rsv").value||0); return true; });

function openTxn(id,preKind){

    +fld("Note (optional)","txNote","text",T?T.note:"")

  openSheet(T?"Edit entry":(preKind==="xfer"?"Move money":"Add"),body,function(){

      } else {

}
function takeGoal(id){
  var G=DB.goals.filter(function(g){ return g.id===id; })[0]; if(!G) return;
  var body=fld("Amount","tgAmt","number","")+sel("Put it into","tgAcc",cashAccts(),(cashAccts()[0]||[""])[0])
    +'<div class="hint">Spending your savings. The goal goes down, the account goes up.</div>';
  openSheet("Take from "+G.name,body,function(){
    var a=+$("#tgAmt").value||0; if(!a){ toast("Enter an amount"); return false; }
    var A=acct($("#tgAcc").value);
    if(A) A.bal=(+A.bal||0)+a;
    G.bal=Math.max(0,(+G.bal||0)-a);
    toast("Took "+P(a)+" from "+G.name);
    return true;
  });
}
function openFix(id){
  var F = id==="new" ? {id:uid(),name:"",amt:0,day:15} : DB.fixed.filter(function(f){return f.id===id;})[0];
  var body=fld("Name","fName","text",F.name)+'<div class="two">'+fld("Amount","fAmt","number",F.amt)+fld("Day of month","fDay","number",F.day)+'</div>'
    +(id==="new"?"":'<div class="btnrow"><button class="btn dan" id="fDel">Delete</button></div>');
  openSheet(id==="new"?"New fixed bill":"Edit bill",body,function(){
    F.name=$("#fName").value||"Bill"; F.amt=+$("#fAmt").value||0; F.day=+$("#fDay").value||1;
    if(id==="new") DB.fixed.push(F);
    return true;
  });
  if(id!=="new") $("#fDel").addEventListener("click",function(){ DB.fixed=DB.fixed.filter(function(x){return x.id!==F.id;}); closeSheet(); save(); render(); });
}

/* ---------- transactions ---------- */
function applyTxn(T,dir){
  var amt=+T.amt||0;
  /* a payment toward a loan, a bill or a card.
     It leaves an account, but it is NOT daily spending: it was already held back. */
  if(T.kind==="pay"){
    var S=acct(T.acct);
    if(S) S.bal = (+S.bal||0) + dir*(S.type==="credit" ? amt : -amt);
    if(T.to){ var C=acct(T.to); if(C && C.type==="credit") C.bal = (+C.bal||0) - dir*amt; }
    return;
  }
  if(T.kind==="xfer"){
    var fee=+T.fee||0;
    var F=acct(T.acct);
    if(F) F.bal = (+F.bal||0) + dir*(F.type==="credit" ? (amt+fee) : -(amt+fee));
    if(String(T.to).indexOf("g:")===0){
      var G=goalById(String(T.to).slice(2));
      if(G){
        G.bal=(+G.bal||0)+dir*amt;
        if(dir>0 && inCycle(T.date)) G.fundedCycle=DB.cycle.start;
      }
      return;
    }
    var X=acct(T.to);
    if(X) X.bal = (+X.bal||0) + dir*(X.type==="credit" ? -amt : amt);
    return;
  }
  var A=acct(T.acct); if(!A) return;
  var sign = (T.kind==="inc") ? 1 : -1;
  if(A.type==="credit") sign = -sign;
  A.bal = (+A.bal||0) + dir*sign*amt;
}
function addTxn(t){
  if(!t.kind) t.kind="exp";
  t.id=uid(); DB.txns.push(t);
  applyTxn(t,1);
  var A=acct(t.acct);
  save(); render();
  if(t.kind==="xfer"){
    var g=(String(t.to).indexOf("g:")===0)?goalById(String(t.to).slice(2)):null;
    var X=g||acct(t.to);
    toast(P(t.amt)+" moved"+(A&&X?" from "+A.name+" to "+X.name:"")+((+t.fee||0)>0?", "+P(t.fee)+" fee":"")+(g?". Savings now "+P(g.bal)+".":"."));
  }
  else if(t.kind==="inc") toast(P(t.amt)+" in"+(A?" to "+A.name:"")+".");
  else if(A&&A.type==="credit") toast(P(t.amt)+" on "+A.name+". Bill now "+P(A.bal)+".");
  else toast(P(t.amt)+" logged. "+P(todayAllowance())+" left today.",function(){ delTxn(t.id); });
}
function quickLog(c){
  if(!c) return;
  var E=env(c.env);
  if(!DB.accounts.length){ toast("Add an account in Setup first"); return; }
  var a = (E && (E.accts||[]).length) ? E.accts[0] : DB.accounts[0].id;
  addTxn({amt:c.def,cat:c.id,acct:a,date:todayISO(),note:""});
}
function delTxn(id){
  for(var i=0;i<DB.txns.length;i++) if(DB.txns[i].id===id){
    applyTxn(DB.txns[i],-1);
    DB.txns.splice(i,1); save(); render(); toast("Removed"); return;
  }
}

/* ---------- data ---------- */
/* one step back: a snapshot taken just before anything destructive */
function snapshot(label){
  try{
    var keep=DB._undo; delete DB._undo;
    var s=JSON.stringify(DB);
    DB._undo={label:label,at:todayISO(),data:s};
  }catch(e){ if(keep) DB._undo=keep; }
}
function undoLabel(){ return (DB._undo&&DB._undo.label)||""; }
function undoLast(){
  if(!DB._undo){ toast("Nothing to undo"); return; }
  var L=DB._undo.label;
  if(!confirm("Undo \""+L+"\"?\n\nEverything goes back to how it was just before that, including anything you have changed since.")) return;
  try{
    var d=JSON.parse(DB._undo.data);
    DB=d; delete DB._undo;
    migrate(); save(); applyTheme(); VIEW="setup"; render();
    toast("Undone: "+L);
  }catch(e){ toast("That snapshot could not be read"); }
}
function doExport(){
  var clean=JSON.parse(JSON.stringify(DB)); delete clean._undo;
  var blob=new Blob([JSON.stringify(clean,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob),a=el("a");
  a.href=url; a.download="daily-backup-"+todayISO()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },1500);
  toast("Backup downloaded");
}
function doImport(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||typeof d!=="object") throw 0;
      if(!confirm("Import this file? It replaces what is on this device.")) return;
      snapshot("Import");
      var back=DB._undo;
      DB=d; DB._undo=back; migrate(); save(); applyTheme(); render(); toast("Imported");
    }catch(err){ toast("That file could not be read"); }
  };
  r.readAsText(f); e.target.value="";
}
function forceUpdate(){
  toast("Checking for a new version…");
  var url=location.href.split("#")[0];
  url += (url.indexOf("?")>-1?"&":"?")+"_cb="+Date.now();
  fetch(url,{cache:"reload"}).then(function(){
    setTimeout(function(){ location.replace(url); },300);
  }).catch(function(){
    location.replace(url);
  });
}
function applyTheme(){
  var t=DB.settings.theme||"auto";
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  document.documentElement.style.setProperty("--accent",DB.settings.accent||"#1D6FA3");
}

/* ---------- misc ---------- */
var toastT=null;
function toast(msg,undo){
  var t=$("#toast");
  t.innerHTML='<span>'+esc(msg)+'</span>';
  if(undo){ var b=el("button"); b.textContent="Undo"; b.onclick=function(){ undo(); t.classList.remove("on"); }; t.appendChild(b); }
  t.classList.add("on"); clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.remove("on"); }, undo?5000:2600);
}
document.querySelector("nav").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  VIEW=b.dataset.v; render();
});
$("#fab").addEventListener("click",function(){ openTxn(null); });

/* drag the sheet down to dismiss */
(function(){
  var sh=$("#sheet"), scr=$("#scrim"), y0=0, y=0, on=false, grab=false;
  function sTop(){ var b=sh.querySelector(".sbody"); return b?b.scrollTop:0; }
  sh.addEventListener("touchstart",function(e){
    if(!sh.classList.contains("on")) return;
    grab = !!(e.target.closest && e.target.closest(".grabzone"));
    if(sTop()>0 && !grab) return;
    y0=e.touches[0].clientY; y=y0; on=true; sh.style.transition="none";
  },{passive:true});
  sh.addEventListener("touchmove",function(e){
    if(!on) return;
    y=e.touches[0].clientY;
    var d=y-y0;
    if(d<=0 || (sTop()>0 && !grab)){ reset(); return; }
    e.preventDefault();
    sh.style.transform="translateY("+d+"px)";
    scr.style.opacity=String(Math.max(0.15,1-d/420));
  },{passive:false});
  function reset(){ on=false; sh.style.transition=""; sh.style.transform=""; scr.style.opacity=""; }
  function end(){
    if(!on) return;
    var d=y-y0; on=false;
    sh.style.transition=""; sh.style.transform=""; scr.style.opacity="";
    if(d>90) closeSheet();
  }
  sh.addEventListener("touchend",end);
  sh.addEventListener("touchcancel",end);
})();

load(); applyTheme(); render();
</script>
